# Configuration file for LLM Memorization Experiments
# This file defines the experimental setup, including models, datasets, and scoring metrics

# Global settings
global:
  # Random seed for reproducibility
  seed: 2022

  # Device configuration
  device: "cuda" # Options: "cuda", "cpu"

  # Model configuration
  model: "EleutherAI/gpt-neo-1.3B"

  # Dataset paths (relative to workspace root or absolute paths)
  dataset_dir: "datasets"

  # Batch size for processing
  batch_size: 64

  # Generation parameters
  generation:
    num_trials: 5 # Number of generation trials per prompt
    val_set_num: 1000 # Number of validation examples
    top_k: 50
    top_p: 1.0
    temperature: 1.0
    repetition_penalty: 1.0

  # Sequence lengths
  prefix_len: 50
  suffix_len: 50

  # Output configuration
  output:
    experiment_name: "default_experiment"
    root_dir: "tmp"
    results_dir: "results"
    guess_dir: "guess_files"
    save_npy_files: true

  # Checkpoint configuration
  checkpoint:
    enabled: true
    save_interval: 1 # Save checkpoint every N trials

# Scoring metrics configuration
# Each metric can be enabled/disabled and configured with specific hyperparameters
metrics:
  # Base likelihood-based metrics
  likelihood:
    module: "likelihood"
    enabled: true
    config: {}

  zlib:
    module: "zlib"
    enabled: true
    config: {}

  metric:
    module: "metric"
    enabled: true
    config:
      num_std: 3 # Number of standard deviations for outlier removal

  high_confidence:
    module: "high_confidence"
    enabled: true
    config:
      confidence_threshold: 0.5
      adjustment_factor: 0.15

  # Recall-based metrics
  suffix_recall:
    module: "suffix_recall"
    enabled: true
    config:
      prefix_len: 50
      suffix_len: 50

  recall:
    module: "recall"
    enabled: true
    config:
      prefix_len: 50
      # non_member_prefix_pool will be loaded from dataset

  con_recall:
    module: "con_recall"
    enabled: true
    config: {}

  suffix_conrecall:
    module: "suffix_conrecall"
    enabled: true
    config:
      prefix_len: 50

  # Min-k based metrics (multiple k ratios)
  min_k_0.1:
    module: "minkprob"
    enabled: true
    config:
      k_ratio: 0.1

  min_k_0.2:
    module: "minkprob"
    enabled: true
    config:
      k_ratio: 0.2

  min_k_0.3:
    module: "minkprob"
    enabled: false
    config:
      k_ratio: 0.3

  min_k_0.4:
    module: "minkprob"
    enabled: false
    config:
      k_ratio: 0.4

  min_k_0.5:
    module: "minkprob"
    enabled: false
    config:
      k_ratio: 0.5

  min_k_0.6:
    module: "minkprob"
    enabled: false
    config:
      k_ratio: 0.6

  min_k_0.7:
    module: "minkprob"
    enabled: false
    config:
      k_ratio: 0.7

  min_k_0.8:
    module: "minkprob"
    enabled: false
    config:
      k_ratio: 0.8

  min_k_0.9:
    module: "minkprob"
    enabled: false
    config:
      k_ratio: 0.9

  min_k_1.0:
    module: "minkprob"
    enabled: false
    config:
      k_ratio: 1.0

  # Min-k++ metrics
  min_k_plus_0.1:
    module: "minkplusplus"
    enabled: true
    config:
      k_ratio: 0.1

  min_k_plus_0.2:
    module: "minkplusplus"
    enabled: true
    config:
      k_ratio: 0.2

  min_k_plus_0.3:
    module: "minkplusplus"
    enabled: false
    config:
      k_ratio: 0.3

  min_k_plus_0.4:
    module: "minkplusplus"
    enabled: false
    config:
      k_ratio: 0.4

  min_k_plus_0.5:
    module: "minkplusplus"
    enabled: false
    config:
      k_ratio: 0.5

  min_k_plus_0.6:
    module: "minkplusplus"
    enabled: false
    config:
      k_ratio: 0.6

  min_k_plus_0.7:
    module: "minkplusplus"
    enabled: false
    config:
      k_ratio: 0.7

  min_k_plus_0.8:
    module: "minkplusplus"
    enabled: false
    config:
      k_ratio: 0.8

  min_k_plus_0.9:
    module: "minkplusplus"
    enabled: false
    config:
      k_ratio: 0.9

  min_k_plus_1.0:
    module: "minkplusplus"
    enabled: false
    config:
      k_ratio: 1.0

  # Surprise metrics (min-k with entropy filtering)
  surprise_0.1:
    module: "surprise"
    enabled: true
    config:
      k_ratio: 0.1
      max_entropy: 2.0

  surprise_0.2:
    module: "surprise"
    enabled: true
    config:
      k_ratio: 0.2
      max_entropy: 2.0

  surprise_0.3:
    module: "surprise"
    enabled: false
    config:
      k_ratio: 0.3
      max_entropy: 2.0

  surprise_0.4:
    module: "surprise"
    enabled: false
    config:
      k_ratio: 0.4
      max_entropy: 2.0

  surprise_0.5:
    module: "surprise"
    enabled: false
    config:
      k_ratio: 0.5
      max_entropy: 2.0

  surprise_0.6:
    module: "surprise"
    enabled: false
    config:
      k_ratio: 0.6
      max_entropy: 2.0

  surprise_0.7:
    module: "surprise"
    enabled: false
    config:
      k_ratio: 0.7
      max_entropy: 2.0

  surprise_0.8:
    module: "surprise"
    enabled: false
    config:
      k_ratio: 0.8
      max_entropy: 2.0

  surprise_0.9:
    module: "surprise"
    enabled: false
    config:
      k_ratio: 0.9
      max_entropy: 2.0

  surprise_1.0:
    module: "surprise"
    enabled: false
    config:
      k_ratio: 1.0
      max_entropy: 2.0

  # Perturbation-based metrics
  lowercase:
    module: "lowercase"
    enabled: true
    config: {}

# MIA Evaluation configuration
mia_evaluation:
  # Threshold for FPR rates to compute TPR
  fpr_thresholds: [0.01, 0.05, 0.1]

  # Number of bootstrap samples for confidence intervals
  n_bootstrap_samples: 100
